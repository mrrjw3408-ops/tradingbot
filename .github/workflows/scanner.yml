name: Trading Bot Scanner

on:
  schedule:
    - cron: '7 14 * * 1-5'
    - cron: '7 17 * * 1-5'
    - cron: '37 21 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas gspread google-auth anthropic

      - name: Create credentials file
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Run scanner
        timeout-minutes: 30
        continue-on-error: true
        run: python3 outcomes.py

      - name: Check outcomes
        timeout-minutes: 8
        continue-on-error: true
        run: python3 outcomes_checker.py

      - name: Run main agent
        if: always()
        timeout-minutes: 15
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: python3 main.py
